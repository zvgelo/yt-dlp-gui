# Build the release artifacts for both platforms.
#
# Never runs on a push to a branch: producing a 200 MB AppImage on every commit
# helps nobody. It runs when a maintainer asks for it, or when a version tag is
# pushed. Nothing is published automatically - the artifacts are uploaded for
# download and validation, and attaching them to a release stays a manual step
# after a clean-machine check.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build inside the release container
        # Debian 11 rather than the runner's own distribution, so the artifact
        # is not linked against a glibc newer than the users' machines
        run: ./scripts/build_linux_appimage_container.sh --allow-dirty

      - name: Install the graphics libraries the artifact expects from the host
        # The AppImage deliberately does not bundle libGL/libEGL - they have to
        # match the driver - and the runner image ships neither. Any machine
        # with a desktop has them; a bare CI runner does not.
        # The runner image also lists Microsoft's package repository, which
        # sometimes answers 403 and fails the whole update; nothing here comes
        # from it
        run: |
          sudo find /etc/apt/sources.list.d -name '*microsoft*' -delete
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libdbus-1-3

      - name: Verify the artifact
        run: |
          artifact=$(ls dist/linux/*.AppImage)
          chmod +x "$artifact"
          "$artifact" --version
          "$artifact" --diagnostics
          QT_QPA_PLATFORM=offscreen "$artifact" --self-test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x86_64
          path: |
            dist/linux/*.AppImage
            dist/linux/SHA256SUMS.txt
            dist/linux/release-manifest.json
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Create the build environment
        run: |
          python -m venv .venv-build
          .venv-build\Scripts\pip install --upgrade pip
          .venv-build\Scripts\pip install -r packaging\requirements-build.txt

      - name: Build
        # Always the portable ZIP; the installer too when the runner image
        # carries Inno Setup. The script says which it produced
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1 -AllowDirty

      - name: Write the manifest and checksums
        run: python scripts\release_manifest.py --platform windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
            dist/windows/SHA256SUMS.txt
            dist/windows/release-manifest.json
          if-no-files-found: error

  publish:
    # A tag push ends in a draft release: the Linux artifacts attached and the
    # CHANGELOG section as the notes. Publishing the draft stays a manual
    # step, after the clean-machine check in docs/RELEASE.md. The Windows
    # bundle remains a workflow artifact until it is validated on Windows.
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    # Only Linux ships in the draft, so a Windows failure must not block it
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linux-x86_64
          path: dist/linux

      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "yt-dlp GUI ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/linux/*.AppImage dist/linux/SHA256SUMS.txt dist/linux/release-manifest.json
