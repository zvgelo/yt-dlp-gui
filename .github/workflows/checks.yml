# Tests and lint on every push and pull request.
#
# Deliberately cheap: no packaging, no network, no artifacts. The release
# workflow does the expensive work when it is actually wanted.
name: checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported interpreter and the one releases are built with
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Qt runtime libraries
        # PySide6 wheels carry Qt itself, but its xcb platform plugin links
        # against these; without them every GUI test fails to start offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install "pytest>=8" "ruff>=0.6"

      - run: ruff check .

      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
